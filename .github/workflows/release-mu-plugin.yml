name: Release MU Plugin Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MU-plugin package
        run: |
          set -eu
          PKG_ROOT="dist"
          PKG_DIR="$PKG_ROOT/starcache"
          VERSION="${GITHUB_REF_NAME:-dev}"
          ARCHIVE="$PKG_ROOT/starcache-mu-plugin-${VERSION}.zip"

          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_DIR"

          cp starcache.php "$PKG_ROOT"/

          cp \
            LICENSE \
            README.md \
            index.php \
            StarAssetMinifier.php \
            StarCache.php \
            StarCacheAdapter.php \
            StarCacheContext.php \
            StarCacheKey.php \
            StarPageCache.php \
            StarPluginLifecycle.php \
            StarQueryCache.php \
            StarResponseController.php \
            StarTransientCache.php \
            StarVersionStore.php \
            uninstall.php \
            "$PKG_DIR"/

          test -f "$PKG_ROOT/starcache.php"
          test -f "$PKG_DIR/StarCacheKey.php"
          php -r '
            define("ABSPATH", sys_get_temp_dir() . "/");
            function add_action() {}
            function add_filter() {}
            function is_admin() { return false; }
            function register_deactivation_hook() {}
            function wp_generate_password($length, $special_chars) { return str_repeat("a", $length); }
            function current_user_can($capability) { return false; }
            function admin_url($path) { return "" . $path; }
            function esc_html($text) { return htmlspecialchars($text, ENT_QUOTES, "UTF-8"); }
            function __($text, $domain) { return $text; }
            function wp_cache_get($key, $group, $force, &$found) { $found = false; return false; }
            function wp_cache_set($key, $value, $group, $expiration) { return true; }
            function wp_cache_delete($key, $group) { return true; }
            function wp_cache_add($key, $value, $group, $expiration) { return true; }
            function wp_cache_flush() { return true; }
            function get_post($post_id) { return null; }
            function wp_using_ext_object_cache() { return false; }
            function wp_json_encode($data) { return json_encode($data); }
            function function_exists($function_name) { return true; }
            require "dist/starcache.php";
            if (!class_exists("StarCache\\StarCacheKey")) {
                throw new RuntimeException("Packaged MU-plugin loader did not load companion classes.");
            }
          '

          (cd "$PKG_ROOT" && zip -r "$(basename "$ARCHIVE")" starcache.php starcache)

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcache-mu-plugin-${{ github.ref_name || github.run_id }}
          path: dist/*.zip

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
